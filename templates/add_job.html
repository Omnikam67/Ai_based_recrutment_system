{% extends "base.html" %}
{% block content %}
<section class="form-panel">
  <div class="form-heading"><p class="eyebrow">OPEN ROLE</p><h1>Add job</h1><p>Describe the position and the skills required to match candidates.</p></div>
  <form method="post" class="form">
    <label>
      <span>Job title</span>
      <input name="job_title" placeholder="e.g. Data Analyst" required>
    </label>
    <label>
      <span>Company</span>
      <input name="company" placeholder="Company name" required>
    </label>
    <label>
      <span>Location</span>
      <input name="location" placeholder="Location">
    </label>
    <label>
      <span>Minimum experience (years)</span>
      <input name="min_experience" type="number" step="0.1" min="0" placeholder="Minimum experience">
    </label>
    <label>
      <span>Job description</span>
      <textarea name="description" rows="7" placeholder="Job description"></textarea>
    </label>
    <label>
      <span>Required skills</span>
      <input name="skills" placeholder="Python, SQL, Power BI" required>
    </label>
    <div class="form-actions"><a class="btn secondary" href="{{ url_for('jobs') }}">Cancel</a><button class="btn" type="submit">Save job</button></div>
  </form>
</section>
{% endblock %}
