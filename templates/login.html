{% extends "base.html" %}
{% block content %}
<div class="auth-shell">
  <div class="login-panel">
    <div class="auth-brand"><span class="brand-symbol">S</span><span><strong>SkillMatch AI</strong><small>AI-Based Talent Acquisition<br>&amp; Skill Gap Analytics</small></span></div>
    <h1>Welcome back</h1>
    <p>Sign in to continue to your recruitment workspace.</p>

    <form class="form" method="post">
      <label>
        Sign in as
        <select name="role" required>
          <option value="HR">Administrator</option>
          <option value="User">Candidate</option>
        </select>
      </label>

      <label>
        Email address
        <input type="email" name="email" placeholder="you@example.com" autocomplete="username" required>
      </label>

      <label>
        Password
        <input type="password" name="password" placeholder="Enter password" autocomplete="current-password" required>
      </label>

      <button class="btn" type="submit">Sign in</button>
    </form>

    <p class="auth-footnote">New to SkillMatch? <a href="{{ url_for('register') }}">Create an account</a></p>
  </div>
</div>
{% endblock %}
