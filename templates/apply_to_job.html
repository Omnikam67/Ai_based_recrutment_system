{% extends "base.html" %}
{% block content %}
<section class="form-panel">
  <div class="form-heading"><p class="eyebrow">APPLICATION</p><h1>Apply candidate</h1><p>{{ job.job_title }} · {{ job.company }}</p></div>
  <form method="post" class="form">
    <label>
      <span>Select candidate</span>
      <select name="candidate_id" required>
        <option value="">-- Choose a candidate --</option>
        {% for candidate in candidates %}
        <option value="{{ candidate.candidate_id }}">{{ candidate.name }} ({{ candidate.email }})</option>
        {% endfor %}
      </select>
    </label>
    <div class="form-actions"><a class="btn secondary" href="{{ url_for('jobs') }}">Cancel</a><button class="btn" type="submit">Submit application</button></div>
  </form>
</section>
{% endblock %}
